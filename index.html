<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vella </title>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #212121; /* Main Background */
        color: #ECECEC; /* Primary Text */
      }
      /* Custom Scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #424242; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #686868; 
      }
      /* Utilities */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
        /* Animations */
      @keyframes appear {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-appear {
        animation: appear 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes messagePopLeft {
        0% { opacity: 0; transform: translate(-10px, 10px) scale(0.95); }
        100% { opacity: 1; transform: translate(0, 0) scale(1); }
      }
      @keyframes messagePopRight {
        0% { opacity: 0; transform: translate(10px, 10px) scale(0.95); }
        100% { opacity: 1; transform: translate(0, 0) scale(1); }
      }
      .animate-msg-left {
        animation: messagePopLeft 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      }
      .animate-msg-right {
        animation: messagePopRight 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      }

      /* Waveform Animation */
      @keyframes waveform {
        0%, 100% { height: 8px; transform: scaleY(1); }
        50% { height: 32px; transform: scaleY(1.5); }
      }
      .waveform-bar {
        width: 4px;
        border-radius: 99px;
        animation: waveform 1.2s ease-in-out infinite;
      }
      .waveform-bar:nth-child(1) { animation-delay: 0.0s; }
      .waveform-bar:nth-child(2) { animation-delay: 0.2s; }
      .waveform-bar:nth-child(3) { animation-delay: 0.4s; }
      .waveform-bar:nth-child(4) { animation-delay: 0.1s; }
      .waveform-bar:nth-child(5) { animation-delay: 0.3s; }
      .waveform-bar:nth-child(6) { animation-delay: 0.5s; }
      .waveform-bar:nth-child(7) { animation-delay: 0.2s; }
      .waveform-bar:nth-child(8) { animation-delay: 0.4s; }

    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
